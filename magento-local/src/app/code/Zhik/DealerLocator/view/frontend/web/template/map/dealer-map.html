<!-- ko if: mapLoadError -->
<div class="map-error-overlay">
    <div class="map-error-content">
        <div class="error-icon">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
            </svg>
        </div>
        <h2 data-bind="i18n: 'Unable to Load Map'"></h2>
        <p data-bind="text: mapErrorMessage"></p>
        <div class="error-actions">
            <button type="button" class="action primary" data-bind="click: reloadPage">
                <span data-bind="i18n: 'Reload Page'"></span>
            </button>
        </div>
    </div>
</div>
<!-- /ko -->
